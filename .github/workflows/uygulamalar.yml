# BogaMail uygulamaları — Posta ve Yönetim, dört platform.
#  - Android : kalıcı anahtarla imzalı APK  → GitHub sürümü
#  - iPhone  : App Store profiliyle imzalanır → TestFlight
#  - Mac     : Mac App Store imzası + .pkg     → App Store Connect (TestFlight / Mac)
#  - Windows : Inno Setup kurulum dosyası + taşınabilir zip → GitHub sürümü
# Gizliler (Settings → Secrets → Actions):
#   ASC_KEY_P8, IOS_P12_B64, IOS_P12_PASS, MAC_APP_P12_B64, MAC_INST_P12_B64, MAC_P12_PASS,
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS
# Profiller: imza/<uygulama>-ios.mobileprovision, imza/<uygulama>-macos.provisionprofile
name: Uygulamalar

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', '.github/workflows/uygulamalar.yml', 'imza/**', 'kurulum/**']
  workflow_dispatch:
    inputs:
      uygulama:
        description: 'Hangi uygulama'
        type: choice
        options: [ikisi, posta, yonetim]
        default: ikisi
      platform:
        description: 'Hangi platform'
        type: choice
        options: [hepsi, android, ios, macos, windows]
        default: hepsi

concurrency:
  group: uygulamalar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'
  ASC_KEY_ID: 5Z9AN85989
  ASC_ISSUER: e0998d8d-1026-4fe2-b8bd-d2f5715dbef8

jobs:
  hazirla:
    runs-on: ubuntu-latest
    outputs:
      uygulamalar: ${{ steps.s.outputs.uygulamalar }}
      android: ${{ steps.s.outputs.android }}
      ios: ${{ steps.s.outputs.ios }}
      macos: ${{ steps.s.outputs.macos }}
      windows: ${{ steps.s.outputs.windows }}
      etiket: ${{ steps.s.outputs.etiket }}
    steps:
      - id: s
        run: |
          U="${{ inputs.uygulama || 'ikisi' }}"; P="${{ inputs.platform || 'hepsi' }}"
          if [ "$U" = ikisi ]; then echo 'uygulamalar=["posta","yonetim"]' >> $GITHUB_OUTPUT; else echo "uygulamalar=[\"$U\"]" >> $GITHUB_OUTPUT; fi
          for p in android ios macos windows; do
            if [ "$P" = hepsi ] || [ "$P" = "$p" ]; then echo "$p=true" >> $GITHUB_OUTPUT; else echo "$p=false" >> $GITHUB_OUTPUT; fi
          done
          echo "etiket=surum-${{ github.run_number }}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kurulum
      - name: Sürüm kaydı
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="surum-${{ github.run_number }}"; R="${{ github.repository }}"
          gh release view "$T" --repo "$R" >/dev/null 2>&1 || gh release create "$T" --repo "$R" --target "${{ github.sha }}" \
            --title "BogaMail derleme ${{ github.run_number }}" --notes-file kurulum/surum-notlari.md --prerelease

  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analiz ve testler
        run: |
          set -e
          for d in packages/boga_ortak apps/posta apps/yonetim; do
            echo "== $d"; (cd $d && flutter analyze --no-fatal-infos)
            if [ -d $d/test ]; then (cd $d && flutter test); fi
          done

  android:
    needs: [hazirla, analiz]
    if: needs.hazirla.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        uygulama: ${{ fromJson(needs.hazirla.outputs.uygulamalar) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.uygulama }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: İmza anahtarı
        id: g
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::ANDROID_KEYSTORE_B64 gizlisi yok — yalnız derleme denetimi yapılır"; exit 0; fi
          echo "var=1" >> $GITHUB_OUTPUT
          echo "$KS_B64" | base64 -d > android/app/imza.p12
          printf 'storeFile=imza.p12\nstorePassword=%s\nkeyAlias=bogamail\nkeyPassword=%s\nstoreType=pkcs12\n' "$KS_PASS" "$KS_PASS" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Adlandır ve yükle
        if: steps.g.outputs.var == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -f android/app/imza.p12 android/key.properties
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          AD=$([ "${{ matrix.uygulama }}" = posta ] && echo BogaMail || echo BogaMail-Yonetim)
          mkdir -p cikti && cp build/app/outputs/flutter-apk/app-release.apk "cikti/$AD-$V-${{ github.run_number }}-Android.apk"
          gh release upload "${{ needs.hazirla.outputs.etiket }}" cikti/* --repo "${{ github.repository }}" --clobber

  ios:
    needs: [hazirla, analiz]
    if: needs.hazirla.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        uygulama: ${{ fromJson(needs.hazirla.outputs.uygulamalar) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.uygulama }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "Xcode 26 yok"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer" && xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Derle (imzasız)
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
      - name: Gizliler var mı
        id: g
        env:
          P12: ${{ secrets.IOS_P12_B64 }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$P12" ] && [ -n "$K" ]; then echo "var=1" >> $GITHUB_OUTPUT; else echo "::warning::iOS imza gizlileri yok — yalnız derleme denetimi yapıldı"; fi
      - name: Anahtarlığı hazırla
        if: steps.g.outputs.var == '1'
        env:
          P12: ${{ secrets.IOS_P12_B64 }}
          PASS: ${{ secrets.IOS_P12_PASS }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          KC=$RUNNER_TEMP/imza.keychain-db; KP=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/d.p12
          security create-keychain -p "$KP" $KC
          security set-keychain-settings -lut 1800 $KC
          security unlock-keychain -p "$KP" $KC
          security import $RUNNER_TEMP/d.p12 -P "$PASS" -A -t cert -f pkcs12 -k $KC
          rm -f $RUNNER_TEMP/d.p12
          curl -sfL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/wwdr.cer && security import $RUNNER_TEMP/wwdr.cer -k $KC || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KP" $KC >/dev/null
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$K" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: İmzala (App Store)
        if: steps.g.outputs.var == '1'
        run: |
          set -e
          PROFIL=../../imza/${{ matrix.uygulama }}-ios.mobileprovision
          rm -rf imzali && mkdir -p imzali/Payload && cp -R build/ios/iphoneos/Runner.app imzali/Payload/
          APP=imzali/Payload/Runner.app
          cp "$PROFIL" $APP/embedded.mobileprovision
          security cms -D -i "$PROFIL" > prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' prof.plist > ent.plist
          KIMLIK=$(security find-identity -v -p codesigning | grep -o '"iPhone Distribution[^"]*\|"Apple Distribution[^"]*\|"iOS Distribution[^"]*' | head -1 | tr -d '"')
          echo "Kimlik: $KIMLIK"
          find $APP/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) 2>/dev/null | while read f; do
            codesign -f -s "$KIMLIK" --timestamp=none "$f"; done
          find $APP/PlugIns -maxdepth 1 -name '*.appex' 2>/dev/null | while read f; do
            codesign -f -s "$KIMLIK" --timestamp=none "$f"; done
          codesign -f -s "$KIMLIK" --entitlements ent.plist --timestamp=none $APP
          codesign -v --deep --strict $APP
          (cd imzali && zip -qry ../uygulama.ipa Payload)
          echo "Sürüm: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $APP/Info.plist))"
      - name: TestFlight'a yükle
        if: steps.g.outputs.var == '1'
        run: |
          xcrun altool --validate-app -f uygulama.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
          xcrun altool --upload-app -f uygulama.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
      - name: Güncelleme işareti
        if: steps.g.outputs.var == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          AD=$([ "${{ matrix.uygulama }}" = posta ] && echo BogaMail || echo BogaMail-Yonetim)
          F="$AD-$V-${{ github.run_number }}-iOS.testflight"
          echo "TestFlight'a yüklendi" > "$RUNNER_TEMP/$F"
          gh release upload "${{ needs.hazirla.outputs.etiket }}" "$RUNNER_TEMP/$F" --repo "${{ github.repository }}" --clobber
      - name: Temizle
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/imza.keychain-db 2>/dev/null || true
          rm -rf ~/.appstoreconnect

  macos:
    needs: [hazirla, analiz]
    if: needs.hazirla.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        uygulama: ${{ fromJson(needs.hazirla.outputs.uygulamalar) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.uygulama }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-number ${{ github.run_number }}
      - name: Gizliler var mı
        id: g
        env:
          APP_P12: ${{ secrets.MAC_APP_P12_B64 }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$APP_P12" ] && [ -n "$K" ]; then echo "var=1" >> $GITHUB_OUTPUT; else echo "::warning::Mac imza gizlileri yok — yalnız derleme denetimi yapıldı"; fi
      - name: Anahtarlığı hazırla
        if: steps.g.outputs.var == '1'
        env:
          APP_P12: ${{ secrets.MAC_APP_P12_B64 }}
          INST_P12: ${{ secrets.MAC_INST_P12_B64 }}
          PASS: ${{ secrets.MAC_P12_PASS }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          KC=$RUNNER_TEMP/mac.keychain-db; KP=$(uuidgen)
          security create-keychain -p "$KP" $KC
          security set-keychain-settings -lut 3600 $KC
          security unlock-keychain -p "$KP" $KC
          for v in APP_P12 INST_P12; do
            printf '%s' "${!v}" | base64 --decode > $RUNNER_TEMP/k.p12
            security import $RUNNER_TEMP/k.p12 -P "$PASS" -A -t cert -f pkcs12 -k $KC
          done
          rm -f $RUNNER_TEMP/k.p12
          curl -sfL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/wwdr.cer && security import $RUNNER_TEMP/wwdr.cer -k $KC || true
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -k "$KP" $KC >/dev/null
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$K" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: İmzala ve paketle
        if: steps.g.outputs.var == '1'
        run: |
          set -e
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          PROFIL=../../imza/${{ matrix.uygulama }}-macos.provisionprofile
          cp "$PROFIL" "$APP/Contents/embedded.provisionprofile"
          security cms -D -i "$PROFIL" > prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' prof.plist > profent.plist
          cp macos/Runner/Release.entitlements ent.plist
          for k in com.apple.application-identifier com.apple.developer.team-identifier com.apple.developer.aps-environment; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$k" profent.plist)
            /usr/libexec/PlistBuddy -c "Add :$k string $V" ent.plist
          done
          plutil -p ent.plist
          UYG=$(security find-identity -v -p codesigning | grep -o '"3rd Party Mac Developer Application[^"]*\|"Apple Distribution[^"]*' | head -1 | tr -d '"')
          YUK=$(security find-identity -v | grep -o '"3rd Party Mac Developer Installer[^"]*' | head -1 | tr -d '"')
          echo "Uygulama kimliği: $UYG / Yükleyici: $YUK"
          find "$APP/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) 2>/dev/null | while read f; do
            codesign -f -s "$UYG" --timestamp=none "$f"; done
          codesign -f -s "$UYG" --entitlements ent.plist --timestamp=none "$APP"
          codesign -v --deep --strict "$APP"
          mkdir -p cikti
          productbuild --component "$APP" /Applications --sign "$YUK" cikti/uygulama.pkg
          echo "Sürüm: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"))"
      - name: App Store Connect'e yükle
        if: steps.g.outputs.var == '1'
        run: |
          xcrun altool --validate-app -f cikti/uygulama.pkg -t macos --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
          xcrun altool --upload-app -f cikti/uygulama.pkg -t macos --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
      - name: Güncelleme işareti
        if: steps.g.outputs.var == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          AD=$([ "${{ matrix.uygulama }}" = posta ] && echo BogaMail || echo BogaMail-Yonetim)
          F="$AD-$V-${{ github.run_number }}-macOS.testflight"
          echo "TestFlight'a yüklendi" > "$RUNNER_TEMP/$F"
          gh release upload "${{ needs.hazirla.outputs.etiket }}" "$RUNNER_TEMP/$F" --repo "${{ github.repository }}" --clobber
      - name: Temizle
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/mac.keychain-db 2>/dev/null || true
          rm -rf ~/.appstoreconnect

  windows:
    needs: [hazirla, analiz]
    if: needs.hazirla.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        uygulama: ${{ fromJson(needs.hazirla.outputs.uygulamalar) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.uygulama }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number ${{ github.run_number }}
      - name: Kurulum dosyası
        run: |
          set -e
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          DOSYA=$([ "${{ matrix.uygulama }}" = posta ] && echo BogaMail || echo BogaMail-Yonetim)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || { choco install innosetup -y --no-progress >/dev/null; }
          mkdir -p cikti
          "$ISCC" //Qp "//DUygulama=${{ matrix.uygulama }}" "//DDosya=$DOSYA-$V-${{ github.run_number }}-Windows-Kurulum" "//DSurum=$V.${{ github.run_number }}" "//DKaynak=$(cygpath -w "$PWD/build/windows/x64/runner/Release")" "//DCikti=$(cygpath -w "$PWD/cikti")" "//DSimge=$(cygpath -w "$PWD/windows/runner/resources/app_icon.ico")" "$(cygpath -w "$PWD/../../kurulum/windows.iss")"
          (cd build/windows/x64/runner/Release && 7z a -tzip "../../../../../cikti/$DOSYA-$V-${{ github.run_number }}-Windows-Tasinabilir.zip" . >/dev/null)
          ls -la cikti
      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.hazirla.outputs.etiket }}" cikti/* --repo "${{ github.repository }}" --clobber
